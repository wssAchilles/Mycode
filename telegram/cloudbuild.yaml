steps:
  # 0. Pull the latest image to use as Docker layer cache (speeds up pip install)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull us-central1-docker.pkg.dev/telegram-467705/telegram-ml-repo/ml-services:latest || true'

  # 1. Build the container image (--cache-from reuses layers from the previous build)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'us-central1-docker.pkg.dev/telegram-467705/telegram-ml-repo/ml-services:latest'
      - '-t'
      - 'us-central1-docker.pkg.dev/telegram-467705/telegram-ml-repo/ml-services:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/telegram-467705/telegram-ml-repo/ml-services:latest'
      - './telegram/ml-services'

  # 2. Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/telegram-467705/telegram-ml-repo/ml-services:$BUILD_ID']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/telegram-467705/telegram-ml-repo/ml-services:latest']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'telegram-ml-services'
      - '--image'
      - 'us-central1-docker.pkg.dev/telegram-467705/telegram-ml-repo/ml-services:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8000'
      - '--memory'
      - '4Gi'
      - '--timeout'
      - '1200'
      - '--allow-unauthenticated'
      # V2 (app:app) 与 V3 (docker/cloudbuild.serving.yaml -> src.serving.main:app) 已实现全端点对等兼容，
      # 高危写接口 (/vf/blacklist/*, /vf/rules/*, /jobs/*) 均由应用层内部密钥恒定时间门禁保护。
      # 环境变量保留已配置的线上参数；生产推荐优先使用 ml-services/docker/cloudbuild.serving.yaml 构建内置 V3 产物的镜像。
images:
  - 'us-central1-docker.pkg.dev/telegram-467705/telegram-ml-repo/ml-services:$BUILD_ID'
  - 'us-central1-docker.pkg.dev/telegram-467705/telegram-ml-repo/ml-services:latest'

options:
  logging: CLOUD_LOGGING_ONLY
