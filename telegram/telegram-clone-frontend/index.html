<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Telegram Clone - 端到端加密的即时通讯应用，支持群聊、文件分享、AI 助手" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Telegram Clone" />
    <meta property="og:description" content="端到端加密的即时通讯应用" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Performance hints -->
    <link rel="preconnect" href="https://api.xuziqi.tech" crossorigin />
    <link rel="dns-prefetch" href="https://api.xuziqi.tech" />

    <!-- 首屏防闪烁主题预设脚本 -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('tg:theme-mode') || 'light';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'dark' || (mode === 'system' && prefersDark) ? 'dark' : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', resolved);
          if (resolved === 'dark') root.classList.add('dark');
          root.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0B1117' : '#FFFFFF');
        } catch (e) {}
      })();
    </script>

    <title>Telegram Clone</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
